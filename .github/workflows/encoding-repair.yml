name: Repair text encoding

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove previous repair backups
        run: find . -maxdepth 1 -type d -name '.encoding-backup-*' -prune -exec rm -rf {} +

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repair mojibake
        run: node fix-encoding.mjs

      - name: Remove generated backup directory
        run: find . -maxdepth 1 -type d -name '.encoding-backup-*' -prune -exec rm -rf {} +

      - name: Commit repaired source
        run: |
          if git diff --quiet; then
            echo "No encoding repairs needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix: repair remaining UTF-8 mojibake"
          git push
