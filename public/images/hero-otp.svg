<svg width="1200" height="820" viewBox="0 0 1200 820" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="120" y1="80" x2="1080" y2="760" gradientUnits="userSpaceOnUse">
    <stop stop-color="#0B1730"/>
    <stop offset="1" stop-color="#111A3A"/>
  </linearGradient>

  <linearGradient id="panel" x1="180" y1="130" x2="970" y2="700" gradientUnits="userSpaceOnUse">
    <stop stop-color="#182B52"/>
    <stop offset="1" stop-color="#101A35"/>
  </linearGradient>

  <linearGradient id="blue" x1="280" y1="210" x2="920" y2="610" gradientUnits="userSpaceOnUse">
    <stop stop-color="#38BDF8"/>
    <stop offset="1" stop-color="#6366F1"/>
  </linearGradient>

  <linearGradient id="green" x1="690" y1="330" x2="850" y2="500" gradientUnits="userSpaceOnUse">
    <stop stop-color="#34D399"/>
    <stop offset="1" stop-color="#10B981"/>
  </linearGradient>

  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#020617" flood-opacity=".55"/>
  </filter>

  <filter id="glow">
    <feGaussianBlur stdDeviation="18"/>
  </filter>

  <filter id="softGlow">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
</defs>

<!-- Background -->
<rect width="1200" height="820" rx="42" fill="url(#bg)"/>

<!-- Ambient glows -->
<circle cx="910" cy="160" r="170" fill="#2563EB" opacity=".13" filter="url(#glow)"/>
<circle cx="270" cy="650" r="180" fill="#7C3AED" opacity=".10" filter="url(#glow)"/>

<!-- Global connection arcs -->
<path d="M105 550C260 310 520 235 810 285C985 316 1075 430 1115 560"
      stroke="#38BDF8" stroke-width="2" opacity=".18"/>
<path d="M155 645C335 430 570 370 830 405C970 424 1040 505 1080 625"
      stroke="#818CF8" stroke-width="2" opacity=".16"/>

<circle cx="164" cy="548" r="6" fill="#38BDF8"/>
<circle cx="815" cy="285" r="6" fill="#818CF8"/>
<circle cx="1080" cy="625" r="6" fill="#38BDF8"/>

<!-- Main product dashboard -->
<g filter="url(#shadow)">
  <rect x="220" y="115" width="700" height="520" rx="30" fill="url(#panel)" stroke="#334A78" stroke-width="2"/>
</g>

<!-- Dashboard header -->
<rect x="220" y="115" width="700" height="76" rx="30" fill="#162747"/>
<circle cx="255" cy="153" r="8" fill="#38BDF8"/>
<circle cx="280" cy="153" r="8" fill="#6366F1"/>
<circle cx="305" cy="153" r="8" fill="#34D399"/>

<text x="350" y="160" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="25" font-weight="700">
  FredOTP
</text>

<text x="730" y="160" fill="#64748B" font-family="Arial, sans-serif" font-size="15">
  LIVE
</text>

<circle cx="790" cy="154" r="7" fill="#34D399"/>

<!-- Left navigation -->
<rect x="250" y="220" width="185" height="355" rx="20" fill="#0F1B34" stroke="#243B63"/>

<text x="280" y="258" fill="#64748B" font-family="Arial, sans-serif" font-size="13" font-weight="700">
  VIRTUAL NUMBERS
</text>

<rect x="270" y="282" width="145" height="62" rx="14" fill="#172B50"/>
<circle cx="295" cy="313" r="15" fill="#2563EB" opacity=".25"/>
<path d="M288 307H302M288 313H302M288 319H299" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
<text x="320" y="308" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="13">Nigeria</text>
<text x="320" y="327" fill="#64748B" font-family="Arial, sans-serif" font-size="12">+234</text>

<rect x="270" y="360" width="145" height="62" rx="14" fill="#121F3A"/>
<circle cx="295" cy="391" r="15" fill="#6366F1" opacity=".22"/>
<text x="320" y="386" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="13">United Kingdom</text>
<text x="320" y="405" fill="#64748B" font-family="Arial, sans-serif" font-size="12">+44</text>

<rect x="270" y="438" width="145" height="62" rx="14" fill="#121F3A"/>
<circle cx="295" cy="469" r="15" fill="#38BDF8" opacity=".18"/>
<text x="320" y="464" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="13">United States</text>
<text x="320" y="483" fill="#64748B" font-family="Arial, sans-serif" font-size="12">+1</text>

<!-- Main SMS panel -->
<rect x="465" y="220" width="420" height="355" rx="22" fill="#0B152B" stroke="#263C66"/>

<text x="495" y="260" fill="#94A3B8" font-family="Arial, sans-serif" font-size="13" font-weight="700">
  INCOMING SMS
</text>

<text x="495" y="292" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="22" font-weight="700">
  Verification message
</text>

<!-- SMS card -->
<rect x="495" y="320" width="360" height="120" rx="18" fill="#14294C" stroke="#28548D"/>

<circle cx="530" cy="360" r="22" fill="#2563EB" opacity=".25"/>
<path d="M520 357L527 364L541 348" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

<text x="565" y="354" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="13">
  FredOTP • Incoming SMS
</text>

<text x="565" y="385" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="25" font-weight="800" letter-spacing="4">
  483 921
</text>

<text x="565" y="412" fill="#64748B" font-family="Arial, sans-serif" font-size="12">
  Received just now
</text>

<!-- Verification status -->
<rect x="495" y="465" width="360" height="76" rx="16" fill="#0E2A29" stroke="#155E56"/>

<circle cx="530" cy="503" r="19" fill="url(#green)" opacity=".2"/>
<path d="M521 503L528 510L541 495" stroke="#34D399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

<text x="565" y="499" fill="#D1FAE5" font-family="Arial, sans-serif" font-size="14" font-weight="700">
  Number verified
</text>

<text x="565" y="521" fill="#6EE7B7" font-family="Arial, sans-serif" font-size="12">
  OTP received successfully
</text>

<!-- Floating notification -->
<g filter="url(#shadow)">
  <rect x="785" y="555" width="300" height="112" rx="22" fill="#172B50" stroke="#385B91" stroke-width="2"/>
</g>

<circle cx="825" cy="595" r="20" fill="#2563EB" opacity=".22"/>
<path d="M814 594C814 588 819 584 825 584C831 584 836 588 836 594V601L840 605H810L814 601V594Z"
      stroke="#38BDF8" stroke-width="2" fill="none"/>

<text x="860" y="591" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="14" font-weight="700">
  Incoming SMS
</text>

<text x="860" y="615" fill="#94A3B8" font-family="Arial, sans-serif" font-size="12">
  +234 812 ••• •921
</text>

<circle cx="1044" cy="588" r="5" fill="#34D399"/>

<!-- Security badge -->
<g filter="url(#shadow)">
  <rect x="120" y="180" width="145" height="145" rx="30" fill="#14284B" stroke="#315485" stroke-width="2"/>
</g>

<path d="M192 213L225 226V254C225 279 208 294 192 300C176 294 159 279 159 254V226L192 213Z"
      fill="#2563EB" opacity=".18" stroke="#38BDF8" stroke-width="2"/>

<path d="M178 254L188 264L207 241"
      stroke="#34D399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

<text x="143" y="347" fill="#64748B" font-family="Arial, sans-serif" font-size="12" font-weight="700">
  SECURE OTP
</text>

<!-- Bottom metric cards -->
<rect x="275" y="670" width="190" height="78" rx="20" fill="#132544" stroke="#263F6A"/>
<text x="300" y="701" fill="#64748B" font-family="Arial, sans-serif" font-size="11" font-weight="700">
  GLOBAL COVERAGE
</text>
<text x="300" y="728" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="21" font-weight="800">
  120+ countries
</text>

<rect x="485" y="670" width="190" height="78" rx="20" fill="#132544" stroke="#263F6A"/>
<text x="510" y="701" fill="#64748B" font-family="Arial, sans-serif" font-size="11" font-weight="700">
  DELIVERY
</text>
<text x="510" y="728" fill="#34D399" font-family="Arial, sans-serif" font-size="21" font-weight="800">
  Instant
</text>

<rect x="695" y="670" width="190" height="78" rx="20" fill="#132544" stroke="#263F6A"/>
<text x="720" y="701" fill="#64748B" font-family="Arial, sans-serif" font-size="11" font-weight="700">
  PROTECTION
</text>
<text x="720" y="728" fill="#38BDF8" font-family="Arial, sans-serif" font-size="21" font-weight="800">
  Verified
</text>

</svg>